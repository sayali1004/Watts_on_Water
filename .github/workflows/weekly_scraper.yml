name: Scrape SCEIN Data
on:
  schedule:
    - cron: '0 8 * * 1'  # Monday at 8 AM
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*.xlsx'
      - 'scraper.py'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pandas openpyxl requests beautifulsoup4 supabase lxml python-dateutil
    
    - name: Run scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        EXCEL_PATH: 'SCEIN Fellowship_Data Tracker Google Sheets_1.xlsx'
      run: |
        python scraper.py
