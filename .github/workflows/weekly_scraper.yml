name: SCEIN Weekly Scraper

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl requests beautifulsoup4 geopy lxml

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated CSV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "SCEIN Scraper Bot"
          git config --global user.email "scraper@scein.auto"
          git add scraped_data.csv scraper.log
          git diff --staged --quiet || git commit -m "Weekly data refresh - $(date +'%Y-%m-%d')"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/sayali1004/Watts_on_Water.git main
