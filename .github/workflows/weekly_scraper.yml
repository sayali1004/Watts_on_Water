name: Scrape SCEIN Data
on:
  schedule:
    - cron: '0 8 * * 1'  # Monday at 8 AM
  
  workflow_dispatch:
  
  push:
    branches: [ main ]
    paths:
      - '*.xlsx'
      - 'scraper.py'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Updated to v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pandas openpyxl requests beautifulsoup4 supabase lxml python-dateutil
    
    - name: Run scraper
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        EXCEL_PATH: 'SCEIN_Fellowship_Data_Tracker_Google_Sheets__1_.xlsx'
      run: |
        python scraper.py
    
    # If you need to upload artifacts, use v4
    - name: Upload results (if needed)
      if: always()  # Run even if scraper fails, to see output
      uses: actions/upload-artifact@v4
      with:
        name: scraper-results
        path: |
          *.xlsx
          *.log
        retention-days: 7
