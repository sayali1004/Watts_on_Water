name: SCEIN Weekly Scraper

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl requests beautifulsoup4 geopy lxml

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "SCEIN Scraper Bot"
          git config --global user.email "scraper@scein.auto"
          git fetch origin main
          git reset --soft origin/main
          git add scraped_data.csv scraper.log
          git diff --staged --quiet || git commit -m "Weekly data refresh - $(date +'%Y-%m-%d')"
          git push origin main
